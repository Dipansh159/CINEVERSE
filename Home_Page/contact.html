<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact • CineVerse</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Bebas+Neue&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #050505;
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .navbar {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      padding: 20px 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      gap: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .navbar a {
      color: #ccc;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .navbar a:hover,
    .navbar a.active {
      color: #f5c518;
      text-shadow: 0 0 10px rgba(245, 197, 24, 0.5);
    }

    .container {
      padding: 80px 60px;
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
      position: relative;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255, 107, 107, 0.15) 0%, transparent 70%);
      z-index: -1;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 80px;
      color: #fff;
      margin-bottom: 20px;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #ff6b6b, #4facfe);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 20px;
      color: #bbb;
      line-height: 1.6;
      margin-bottom: 50px;
    }

    .contact-form {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 20px;
      text-align: left;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      color: #ccc;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.3s;
    }

    .form-control:focus {
      outline: none;
      border-color: #ff6b6b;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 150px;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(90deg, #ff6b6b, #4facfe);
      border: none;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <a href="index_home.html">Home</a>
    <a href="http://localhost:5173/">MoodMatcher</a>
    <a href="about.html">About</a>
    <a href="chat.html">Chatbot</a>
    <a href="movies.html">Movies</a>
    <a href="contact.html" class="active">Contact</a>


  </nav>

  <main class="container">
    <h1>Get in Touch</h1>
    <p>Have questions, feedback, or movie recommendations? We'd love to hear from you.</p>

    <form class="contact-form"
      onsubmit="event.preventDefault(); alert('Thanks for reaching out! We will get back to you soon.');">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" class="form-control" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
      </div>
      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" class="form-control" placeholder="Tell us what you think..." required></textarea>
      </div>
      <button type="submit" class="submit-btn">Send Message</button>
    </form>
  </main>

</body>

</html>
